services:
  gpt-image-playground:
    image: ${IMAGE:-ghcr.io/your-github-user/gpt_image_playground:latest}
    container_name: gpt-image-playground
    restart: unless-stopped
    ports:
      - "${APP_HOST:-127.0.0.1}:${APP_PORT:-8080}:80"
    environment:
      DEFAULT_API_URL: ${DEFAULT_API_URL:-}
      API_PROXY_URL: ${API_PROXY_URL:-https://cn.proxy2it.com/v1}
      API_PROXY_HEARTBEAT_MS: ${API_PROXY_HEARTBEAT_MS:-15000}
      API_PROXY_READ_TIMEOUT: ${API_PROXY_READ_TIMEOUT:-600s}
      API_PROXY_SEND_TIMEOUT: ${API_PROXY_SEND_TIMEOUT:-600s}
      ENABLE_API_PROXY: ${ENABLE_API_PROXY:-true}
      LOCK_API_PROXY: ${LOCK_API_PROXY:-true}
      PROMPT_CASE_DATASET_URL: ${PROMPT_CASE_DATASET_URL:-https://raw.githubusercontent.com/sunlightcold/gpt_image_playground/main/public/data/gpt-image-2/cases.json}
      PROMPT_CASE_DATASET_CACHE_SECONDS: ${PROMPT_CASE_DATASET_CACHE_SECONDS:-600}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
